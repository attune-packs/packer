ref: packer
label: "HashiCorp Packer"
description: "Confined, non-interactive HashiCorp Packer CLI actions"
version: "0.1.0"
author: "Attune"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
  category: infrastructure
  documentation_url: "https://github.com/attune-packs/packer"
  repository_url: "https://github.com/attune-packs/packer"
  source_revision: "af813347fdf92cb24e466d4c0f57d9de73196407"
  source_version: "1.0.0"
  license: "Apache-2.0"

tags: [packer, hashicorp, image, infrastructure]
runtime_deps: [python]
dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block
