ref: packer.inspect
label: "Inspect Packer Template"
description: "Inspect the components declared by a Packer template"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: packer_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
parameters:
  template: {type: string, required: true, description: "Template file or directory beneath ATTUNE_ARTIFACTS_DIR"}
  working_directory: {type: string, default: ".", description: "Working directory beneath ATTUNE_ARTIFACTS_DIR"}
  variables: {type: object, default: {}, secret: true, description: "Template variables delivered as PKR_VAR environment values"}
  environment: {type: object, default: {}, secret: true, description: "Explicit Packer/provider environment values; confinement variables are reserved"}
  timeout_seconds: {type: integer, default: 120, minimum: 1, maximum: 7200}
output:
  operation: {type: string, required: true}
  success: {type: boolean, required: true}
  exit_code: {type: integer, required: true}
  timed_out: {type: boolean, required: true}
  duration_seconds: {type: number, required: true}
  command: {type: array, required: true, items: {type: string}}
  working_directory: {type: string, required: true}
  stdout: {type: string, required: true}
  stderr: {type: string, required: true}
  output_truncated: {type: boolean, required: true}
  events: {type: array, required: true, items: {type: object}}
tags: [packer, inspect]
